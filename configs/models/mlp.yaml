# Person 4 reproducible comparison model
seed: 42
cv_folds: 3
hidden_layer_sizes: [32]
activation: relu
solver: adam
alpha: 0.001
learning_rate_init: 0.001
batch_size: 512
max_iter: 40
early_stopping: false
candidate_radius_m: 50.0
max_candidates: 8
label_max_distance_m: 30.0
label_ambiguity_margin_m: 5.0
