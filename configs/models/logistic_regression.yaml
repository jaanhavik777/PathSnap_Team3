# Recorded baseline settings. scripts/train_all.py builds this pipeline.
model: logistic_regression
preprocessing:
  imputation: median
  scaling: standard
estimator:
  C: 1.0
  solver: lbfgs
  max_iter: 500
cross_validation:
  folds: 5
  group: trip_id
artifact: artifacts/baselines/logistic_regression.joblib
