# HistGradientBoosting Configuration — PathSnap Person 3 (Hitha)
# Review 1 Deliverable

model:
  name: "HistGradientBoostingClassifier"
  learning_rate: 0.1
  max_iter: 150
  max_leaf_nodes: 31
  max_depth: null
  min_samples_leaf: 20
  l2_regularization: 0.0
  random_state: 42
  early_stopping: false

features:
  names:
    - distance_meters
    - heading_diff_deg
    - projection_fraction
    - segment_length_m
    - gps_speed_mps
    - bearing_cos
    - bearing_sin
    - proximity_score
  count: 8

hmm:
  beta_meters: 15.0
  sigma_z_meters: 12.0
  max_speed_mps: 45.0
  gap_threshold_sec: 10.0
  min_log_prob: -30.0

cross_validation:
  strategy: "GroupKFold"
  n_splits: 5
  group_column: "trip_id"

training_summary:
  train_trips: 80
  train_candidates: 1806398
  mean_cv_macro_f1: 0.8263
  student_test_trips: 10
  student_test_candidates: 174150
  student_test_macro_f1: 0.8529
  student_test_top1_accuracy: 0.7277
